# The stack the end-to-end suite drives: a database, the HTTP host, and a stand-in for the fiscal
# verification service.
#
#   docker compose -f docker-compose.e2e.yml up -d --build
#   (cd FE && npm run test:e2e)
#   docker compose -f docker-compose.e2e.yml down -v
#
# ./test-e2e.sh does all three. It is a separate file rather than an override of
# docker-compose.yml because the topology genuinely differs, and because Compose appends `ports`
# across files instead of replacing them — an override could not have unpublished 5432.
#
# What differs from the development stack:
#
#   * its own project name, so it never adopts or destroys the containers ./up.sh started
#   * no MCP host: the browser client never talks to it (D1)
#   * PostgreSQL is not published at all — only the API reaches it, over the compose network — so
#     a running development stack on 5432 is not in the way
#   * no named volumes. Every run starts on an empty ledger, which is what makes the suite's
#     assertions about what is in the month true rather than hopeful.
#   * the fiscal verification service is a stub (portal), not mapr.tax.gov.me. It holds one recorded
#     invoice and no other, so a run never depends on a government service being up, and both
#     fetched and not-fetched fiscal captures are exercised against the same stack.

name: expenses-e2e

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: expenses
      POSTGRES_PASSWORD: expenses
      # The ledger's own database is created by the init script, which decides encoding, locale
      # provider and collation — none of which can be altered after creation (D13).
      POSTGRES_DB: postgres
    volumes:
      - ./BE/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U expenses -d expenses']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./BE
      dockerfile: Expenses.Api/Dockerfile
    environment:
      # Development because that is the environment in which this host applies migrations (D15),
      # and an empty database is the point of this stack.
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Expenses: 'Host=postgres;Port=5432;Database=expenses;Username=expenses;Password=expenses'
      Receipts__RootPath: /var/lib/expenses/receipts
      TemporaryReceipts__RootPath: /var/lib/expenses/receipts-temp
      # The stub below, never the government portal: which invoices it holds is fixed, so the
      # suite's outcome does not depend on whether a government service is up.
      Extraction__Portal__BaseAddress: 'http://portal:8080'
      Extraction__Portal__TimeoutMilliseconds: 1000
      # `vite preview` on :4173 is already an allowed origin through appsettings.Development.json.
      # Another would be Cors__AllowedOrigins__N, N past the last index there.
    ports:
      # The same port the development stack publishes, so API_URL=http://localhost:5082 is right for
      # either and nothing about the client has to know it is talking to the e2e stack.
      - '5082:8080'
    depends_on:
      postgres:
        condition: service_healthy
      portal:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:8080/health/ready > /dev/null']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # The fiscal verification service: one recorded invoice, and "no record" for every other (see
  # FE/e2e/portal/server.mjs). Not published — only the API asks it, over the compose network.
  portal:
    image: node:22-alpine
    command: ['node', '/portal/server.mjs']
    volumes:
      - ./FE/e2e/portal/server.mjs:/portal/server.mjs:ro
      - ./BE/tests/Expenses.Integration.Tests/Fixtures/verify-32AA324CFF5030271E16D59F7F8EF636.json:/portal/invoice.json:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8080/health > /dev/null']
      interval: 2s
      timeout: 5s
      retries: 10
